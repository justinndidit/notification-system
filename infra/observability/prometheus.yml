global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orchestrator
    static_configs:
      - targets: ['orchestrator:8080']

  # Cluster-wide aggregates: connections, channels, node health.
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  # Per-queue depth lives only on /metrics/detailed — the default endpoint
  # aggregates across all queues and drops the queue label entirely, which makes
  # it useless for alerting on a specific queue or on the DLQ.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
